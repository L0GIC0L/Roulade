name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Optional: a stable release signature from repository secrets. Without them the APK is
      # signed with a throwaway debug key, which installs fine but can't update a build signed
      # by a different run (uninstall first).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ROULADE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ROULADE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository release key."
          else
            echo "No ROULADE_KEYSTORE_BASE64 secret; signing with a debug key."
          fi

      - name: Unit tests, lint and release APK
        env:
          ROULADE_KEYSTORE_PASSWORD: ${{ secrets.ROULADE_KEYSTORE_PASSWORD }}
          ROULADE_KEY_ALIAS: ${{ secrets.ROULADE_KEY_ALIAS }}
          ROULADE_KEY_PASSWORD: ${{ secrets.ROULADE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "roulade-$VERSION.apk"
          echo "APK=roulade-$VERSION.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: roulade-apk
          path: ${{ env.APK }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Roulade $GITHUB_REF_NAME" --generate-notes
